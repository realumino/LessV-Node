# Cross-compilation defaults used by scripts/release_node.mjs.
#
# WHAT: link Linux musl targets with the lld shipped by rustup, so a host
# without a cross C toolchain can still produce the (pure-Rust) Go-free
# static binary. ring's C core is the only native code and is compiled
# through CC_<target> when a host compiler exists; CI/Linux builds use
# musl-gcc, Windows builds use the zig wrapper documented in the release
# script.
#
# WHY link-self-contained: rustup ships the musl CRT objects and compiler
# builtins for these targets, so rust-lld alone is enough to link.

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
