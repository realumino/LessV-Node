# WHAT: the deployment descriptor for one Vela node.
# WHY one service: a node is one identity (one token, one applied hash) and one
# 443, and the agent restarts Xray and reloads nginx after every apply. Compose
# here is the runtime contract -- restart policy, ulimits, stop grace, volumes --
# not a multi-container topology.
#
# Enrolling is deliberately not a service; run it once, into the same volume:
#   docker run --rm -it -v vela-etc:/etc/vela \
#     --entrypoint /usr/local/bin/vela-server ghcr.io/realumino/vela-server:latest \
#     enroll --cp https://cp.example.org --node tokyo01 \
#     --nginx-conf-path /etc/nginx/http.d/vela-decoy.conf
# (the node token is read from stdin)
services:
  vela-server:
    image: ghcr.io/realumino/vela-server:latest
    container_name: vela-server
    restart: unless-stopped

    # Bridge networking with the two published ports is the default because it
    # behaves the same on every provider and needs nothing but Docker. The cost
    # is source addresses: Xray and the decoy see the docker gateway, and
    # `detected_ip` reports the container's address unless the host runs with
    # host networking instead (then `ports:` must be removed).
    network_mode: bridge
    ports:
      - "80:80"
      - "443:443/tcp"

    volumes:
      # identity: node.toml (token, 0600) and the certificate tree. Losing this
      # volume means re-enrolling the node.
      - vela-etc:/etc/vela
      # state: applied hash, the live Xray config, geodata, last-good snapshot.
      - vela-state:/var/lib/vela

    # An apply can hold the reconciler for `xray -test` (15 s) plus verification
    # (3 s); the grace period must outlast the worst case, and outlast
    # vela-server's own timeout-kill (60 s).
    stop_grace_period: 90s

    # The image's processes inherit this ceiling.
    ulimits:
      nofile: 1000000

    security_opt:
      - no-new-privileges:true

volumes:
  # Explicit names, so the one-off enroll command in the README (and in the
  # service's log line) can mount `vela-etc` by the same name compose uses.
  # Without `name:`, compose would create `vela-server_vela-etc` and enroll
  # into a volume the node never sees.
  vela-etc:
    name: vela-etc
  vela-state:
    name: vela-state